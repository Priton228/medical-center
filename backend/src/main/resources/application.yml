server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: medical-center-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medical_center}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

medcenter:
  jwt:
    secret: ${MEDCENTER_JWT_SECRET:dev-secret-please-change-make-it-at-least-256-bits-long-okay}
    access-token-validity-minutes: 60
    refresh-token-validity-days: 7
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.medcenter: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
